name: IaC CI (Shift-Left)

# Pipeline de validacion temprana (Shift-Left): valida formato y sintaxis
# de la infraestructura (Terraform y Pulumi) automaticamente en cada PR
# y push a main, antes de desplegar nada.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init (sin backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  pulumi-validate:
    name: Validar Pulumi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulumi
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis del programa Pulumi
        # Compila el programa para detectar errores de sintaxis sin necesidad
        # de credenciales de Pulumi ni del Docker Engine.
        run: python -m py_compile __main__.py
